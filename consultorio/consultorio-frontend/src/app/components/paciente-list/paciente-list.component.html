<div class="container mt-4">
  <h2 class="mb-4 text-primary"><i class="bi bi-people-fill me-2"></i>Gestión de Pacientes</h2>

  <!-- Formulario de Registro -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-light fw-bold">Registrar Nuevo Paciente</div>
    <div class="card-body">
      <form (ngSubmit)="guardarPaciente()" class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="nuevoPaciente.documento" name="documento" placeholder="Documento / C.I." required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="nuevoPaciente.nombre" name="nombre" placeholder="Nombre" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="nuevoPaciente.apellido" name="apellido" placeholder="Apellido" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" [(ngModel)]="nuevoPaciente.telefono" name="telefono" placeholder="Teléfono">
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn btn-success"><i class="bi bi-person-plus-fill me-1"></i> Guardar Paciente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de Pacientes -->
  <div class="table-responsive shadow-sm">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Documento</th>
          <th>Nombre Completo</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let paciente of pacientes">
          <td>{{ paciente.id }}</td>
          <td>{{ paciente.documento }}</td>
          <td>{{ paciente.nombre }} {{ paciente.apellido }}</td>
          <td>{{ paciente.telefono || 'N/A' }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="eliminarPaciente(paciente.id)">
              <i class="bi bi-trash-fill"></i> Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="pacientes.length === 0">
          <td colspan="5" class="text-center text-muted py-3">No hay pacientes registrados aún.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
